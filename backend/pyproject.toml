[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerpilot-api"
version = "0.1.0"
description = "LedgerPilot FastAPI backend"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2.0",
  "email-validator>=2.2,<3.0",
  "fastapi>=0.115,<1.0",
  "pandas>=2.2,<4.0",
  "PyMuPDF>=1.24,<2.0",
  "PyJWT>=2.10,<3.0",
  "pwdlib[argon2]>=0.2.1,<1.0",
  "python-multipart>=0.0.20,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "pyodbc>=5.2,<6.0",
  "sqlalchemy>=2.0.36,<3.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.3,<9.0",
  "ruff>=0.7,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["database: requires a reachable Microsoft SQL Server and verifies Alembic migration state"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
